services:
  - type: web
    name: qwen-chat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_NAME
        value: Qwen/Qwen2.5-0.5B-Instruct
      - key: MAX_NEW_TOKENS
        value: "256"
